<!DOCTYPE html>
<html lang="en">
<head>

<title>HD Video Downloader</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#000;color:#fff;padding:14px}
.main{max-width:500px;margin:0 auto}
.top{text-align:center;padding:18px 0 5px}
.top h1{margin:0;font-size:30px;color:#2f7bff;letter-spacing:1px}
.top h1 span{color:#fff}
.top p{color:#aaa;font-size:13px;margin:6px 0}
.badge{display:inline-block;background:#0a2a5e;color:#7fb0ff;border:1px solid #2f7bff;padding:6px 14px;border-radius:20px;font-size:12px;margin-top:8px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.box{background:#0b1220;border:2px solid #1e2e4d;border-radius:16px;padding:18px 8px;text-align:center;cursor:pointer}
.box.active{background:#0a2a5e;border-color:#2f7bff;box-shadow:0 0 18px rgba(47,123,255,.45)}
.box .ic{font-size:30px}
.box h3{margin:8px 0 2px;font-size:16px}
.box p{margin:0;color:#8a9bb
