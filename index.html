<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAMZA DOWNLOADER - V2</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#04070a;color:#fff;font-family:Arial,sans-serif}
header{padding:26px 10px;text-align:center;background:linear-gradient(180deg,#0a1a12,#04070a);border-bottom:1px solid #1a3d2b}
.logo{font-size:28px;font-weight:900;color:#2dff8f;letter-spacing:1px}
.logo span{color:#fff}
header p{color:#8aa89a;font-size:12px;letter-spacing:2px;margin:5px 0 0}
.container{max-width:520px;margin:20px auto;padding:14px}
.card{background:#0b1510;border:1px solid #1e4d33;border-radius:22px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
h2{font-size:20px;margin:0}
.sub{color:#82958a;font-size:13px;margin:6px 0 14px}
.inputbox{width:100%;padding:16px;border-radius:13px;border:1px solid #286b43;background:#07100b;color:#fff;outline:none;font-size:15px}
.inputbox:focus{border-color:#2dff8f}
.platforms{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.platform{background:#101d15;border:1px solid #1e5734;padding:14px 5px;text-align:center;border-radius:13px;font-size:13px;color:#b8d8c5;cursor:pointer;font-weight:bold}
.platform.active{border-color:#2dff8f;color:#2dff8f;background:#123324;box-shadow:0 0 12px #1a5c38}
label{font-size:13px;color:#b8d8c5}
select{width:100%;padding:13px;background:#07100b;color:#fff;border:1px solid #286b43;border-radius:10px;margin:8px 0 14px;outline:none}
.btn{border:0;padding:15px;border-radius:13px;cursor:pointer;font-weight:900;width:100%;font-size:16px}
.download{background:#2dff8f;color:#031208}
.download:disabled{opacity:.6}
.paste{background:#193a28;color:#51ff9c;margin-top:10px}
#status{margin-top:14px;color:#5cff9e;font-size:13px;text-align:center;min-height:18px;line-height:1.5}
.progress{width:100%;height:12px;background:#17251c;border-radius:20px;overflow:hidden;margin-top:14px}
#progressBar{width:0%;height:100%;background:#2dff8f;transition:width .2s}
#percent{text-align:center;color:#55ff9b;margin-top:8px;font-size:13px}
.history{margin-top:20px;padding:15px;background:#0b1510;border-radius:14px;border:1px solid #1e4d33}
.history h3{margin:0 0 10px;font-size:15px}
.note{color:#82958a;font-size:12px;line-height:1.6;margin-top:18px;text-align:center}
footer{text-align:center;color:#718477;font-size:11px;padding:20px}
</style>
</head>
<body>

<header>
 <div class="logo">◉ HAMZA <span>DOWNLOADER</span></div>
 <p>V2 • ALL-IN-ONE • GALLERY SAVE</p>
</header>

<div class="container">
<div class="card">
<h2>Download Your Media</h2>
<p class="sub">Paste your video or audio link</p>

<input id="url" class="inputbox" type="url" placeholder="Paste video link here...">

<div class="platforms">
<div class="platform" onclick="pick(this,'YouTube')">▶ YouTube</div>
<div class="platform" onclick="pick(this,'Instagram')">◎ Instagram</div>
<div class="platform" onclick="pick(this,'Facebook')">f Facebook</div>
<div class="platform" onclick="pick(this,'TikTok')">♪ TikTok</div>
<div class="platform" onclick="pick(this,'Audio')">♫ Audio</div>
<div class="platform" onclick="pick(this,'Other')">▶ Other</div>
</div>

<label>Media Quality</label>
<select id="quality">
<option value="1080">1080p - Full HD</option>
<option value="720" selected>720p - HD</option>
<option value="480">480p</option>
<option value="360">360p</option>
</select>

<label>Download Type</label>
<select id="format">
<option value="video">Video Download</option>
<option value="audio">Audio / MP3 Download</option>
</select>

<button class="btn download" id="downloadBtn" onclick="downloadMedia()">↓ DOWNLOAD NOW</button>
<button class="btn paste" onclick="pasteLink()">📋 PASTE LINK</button>

<div class="progress"><div id="progressBar"></div></div>
<div id="percent">0%</div>
<div id="status">Ready to download</div>
</div>

<div class="history">
<h3>Download History</h3>
<div id="history"></div>
<button onclick="clearHistory()" style="background:#183223;color:#fff;border:0;padding:10px 14px;border-radius:9px;margin-top:10px">Clear History</button>
</div>

<p class="note">Only download content you own or have permission to save.<br>Direct Gallery Save
